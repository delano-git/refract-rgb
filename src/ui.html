<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refract RGB</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f27; --line: #2c2f3b; --text: #e8e9ef; --muted: #8b8fa3;
    --accent: #8b5cf6; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f8; --panel: #fff; --line: #dcdfe8; --text: #1b1d27; --muted: #6a6f85; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .effects { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  button.fx {
    background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 8px; font: inherit; cursor: pointer;
  }
  button.fx:hover { border-color: var(--accent); }
  button.fx[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .row label { width: 96px; color: var(--muted); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row output { width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=color] { width: 52px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 13px; transition: .15s; }
  .switch span::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; align-self: center; }
  .dot.running { background: var(--ok); } .dot.error { background: var(--bad); } .dot.unsupported { background: var(--warn); }
  .detail { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  .empty { color: var(--muted); }
  #offline { display: none; color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Refract RGB</h1>
    <span id="offline">Not connected</span>
    <label class="switch" title="Lights on/off"><input type="checkbox" id="on" aria-label="Lights on"><span></span></label>
  </header>

  <section>
    <h2>Effect</h2>
    <div class="effects" id="effects"></div>
  </section>

  <section>
    <h2>Settings</h2>
    <div class="row"><label for="color">Colour</label><input type="color" id="color"></div>
    <div class="row" id="row-color2"><label for="color2">Second colour</label><input type="color" id="color2"></div>
    <div class="row" id="row-speed"><label for="speed">Speed</label><input type="range" id="speed" min="0.1" max="5" step="0.1"><output id="speed-v"></output></div>
    <div class="row"><label for="brightness">Brightness</label><input type="range" id="brightness" min="0" max="1" step="0.01"><output id="brightness-v"></output></div>
  </section>

  <section>
    <h2>Devices</h2>
    <ul id="devices"><li class="empty">Looking for devices…</li></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let editing = 0; // timestamp of last local edit; polling must not fight the user's hand

async function post(patch) {
  editing = Date.now();
  try {
    await fetch("/api/params", { method: "POST", headers: { "X-Refract": "1", "Content-Type": "application/json" }, body: JSON.stringify(patch) });
  } catch { $("offline").style.display = "inline"; }
}

// Sliders fire constantly; send at most one update per 80 ms.
const throttle = (fn, ms) => { let t = 0, pending; return (...a) => { pending = a; if (!t) { fn(...pending); t = setTimeout(() => { t = 0; if (pending) fn(...pending); pending = null; }, ms); } }; };
const send = throttle(post, 80);

function render(s) {
  const fxBox = $("effects");
  if (fxBox.children.length !== s.effects.length) {
    fxBox.replaceChildren(...s.effects.map((e) => {
      const b = document.createElement("button");
      b.className = "fx"; b.textContent = e.name; b.dataset.id = e.id;
      b.onclick = () => { post({ effect: e.id, on: true }); setEffect(e.id); };
      return b;
    }));
  }
  setEffect(s.effect);
  $("on").checked = s.on;
  if (Date.now() - editing > 1200) {
    $("color").value = s.color; $("color2").value = s.color2;
    $("speed").value = s.speed; $("brightness").value = s.brightness;
  }
  $("speed-v").textContent = (+$("speed").value).toFixed(1) + "×";
  $("brightness-v").textContent = Math.round($("brightness").value * 100) + "%";

  const dev = $("devices");
  dev.replaceChildren(...(s.devices.length ? s.devices.map((d) => {
    const li = document.createElement("li");
    const dot = document.createElement("span"); dot.className = "dot " + d.state;
    const name = document.createElement("span"); name.textContent = d.name;
    const det = document.createElement("span"); det.className = "detail";
    det.textContent = d.state === "running" ? d.detail : d.state + (d.detail ? ": " + d.detail : "");
    li.append(dot, name, det); return li;
  }) : [Object.assign(document.createElement("li"), { className: "empty", textContent: "No devices found yet." })]));
}

function setEffect(id) {
  for (const b of $("effects").children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  $("row-color2").style.display = id === "gradient" ? "" : "none";
  const usesColor = id === "solid" || id === "breathing" || id === "gradient";
  $("color").closest(".row").style.display = usesColor ? "" : "none";
  $("row-speed").style.display = id === "solid" ? "none" : "";
}

async function poll() {
  try {
    const r = await fetch("/api/state");
    state = await r.json();
    $("offline").style.display = "none";
    render(state);
  } catch { $("offline").style.display = "inline"; }
}

$("on").onchange = (e) => post({ on: e.target.checked });
$("color").oninput = (e) => send({ color: e.target.value });
$("color2").oninput = (e) => send({ color2: e.target.value });
$("speed").oninput = (e) => { $("speed-v").textContent = (+e.target.value).toFixed(1) + "×"; send({ speed: +e.target.value }); };
$("brightness").oninput = (e) => { $("brightness-v").textContent = Math.round(e.target.value * 100) + "%"; send({ brightness: +e.target.value }); };

poll(); setInterval(poll, 1500);
</script>
</body>
</html>
