<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refract RGB</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f27; --inset: #262935; --line: #2e313e; --text: #e8e9ef; --muted: #8b8fa3;
    --accent: #8b5cf6; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f8; --panel: #fff; --inset: #eef0f5; --line: #dcdfe8; --text: #1b1d27; --muted: #666b80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .head { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .head .name { font-weight: 600; }
  .head .sub { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.running { background: var(--ok); } .dot.error { background: var(--bad); } .dot.unsupported { background: var(--warn); }
  .follow { color: var(--muted); font-size: 13px; margin: 6px 0 0 19px; }

  .strip { height: 10px; border-radius: 5px; background: var(--inset); margin-bottom: 4px; }
  .panel { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; margin: 9px 0; }
  .row > label:first-child, .row > .lbl { width: 112px; flex: none; color: var(--muted); font-size: 14px; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .row output { width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  select, input[type=text] {
    background: var(--inset); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit; max-width: 100%;
  }
  select { min-width: 190px; }
  select:focus-visible, input:focus-visible, button:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sw { width: 52px; height: 32px; border-radius: 8px; border: 2px solid var(--line); cursor: pointer; padding: 0; flex: none; }
  .sw:hover { border-color: var(--accent); }

  .tog { position: relative; width: 44px; height: 24px; flex: none; display: inline-block; }
  .tog input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
  .tog span { position: absolute; inset: 0; background: var(--line); border-radius: 12px; transition: .15s; }
  .tog span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .tog input:checked + span { background: var(--accent); }
  .tog input:checked + span::after { transform: translateX(20px); }
  .tog input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn { background: var(--inset); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .zones { margin-top: 10px; border-top: 1px solid var(--line); }
  .zone { padding: 8px 0 8px 19px; border-bottom: 1px solid var(--line); }
  .zone:last-child { border-bottom: 0; }
  .zone .panel { margin-top: 8px; padding-top: 8px; }
  .more { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .empty { color: var(--muted); }
  #offline { display: none; color: var(--bad); font-size: 14px; }

  /* colour picker */
  #picker { position: fixed; z-index: 10; width: 244px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.45); display: none; }
  #sv { position: relative; height: 150px; border-radius: 8px; cursor: crosshair; touch-action: none;
        background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), hsl(var(--h, 0) 100% 50%); }
  #sv i { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%, -50%); pointer-events: none; }
  #hue { width: 100%; margin: 12px 0 8px; height: 14px; -webkit-appearance: none; appearance: none; border-radius: 7px; border: 0; padding: 0;
         background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  #hue::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.45); cursor: pointer; }
  #hue::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.45); cursor: pointer; }
  #hexrow { display: flex; gap: 8px; align-items: center; }
  #hexrow .sw { width: 34px; height: 30px; cursor: default; }
  #hex { flex: 1; width: 100%; font-family: ui-monospace, monospace; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .presets button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .presets button:hover { transform: scale(1.12); }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Refract RGB</h1>
    <span id="offline">Not connected</span>
  </header>

  <h2>All devices</h2>
  <div id="global"></div>

  <h2>Devices</h2>
  <div id="devices"><div class="empty">Looking for devices…</div></div>
</main>

<div id="picker" role="dialog" aria-label="Colour picker">
  <div id="sv"><i></i></div>
  <input type="range" id="hue" min="0" max="360" step="1" aria-label="Hue">
  <div id="hexrow"><span class="sw" id="prev" aria-hidden="true"></span><input type="text" id="hex" maxlength="7" spellcheck="false" aria-label="Hex colour"></div>
  <div class="presets" id="presets"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

let S = null;              // last server state
let panels = new Map();    // target -> panel handle
let sig = "";              // structure signature; rebuild only when it changes
const open = new Set();    // expanded zone lists, kept across rebuilds
let lastEdit = 0;

/* ---------- networking ---------- */
const pending = new Map();
let timer = 0;
async function post(body) {
  lastEdit = Date.now();
  try {
    await fetch("/api/params", { method: "POST", headers: { "X-Refract": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) });
    $("offline").style.display = "none";
  } catch { $("offline").style.display = "inline"; }
}
// Sliders and the picker fire continuously; merge patches per target and send at most every 80 ms.
function send(target, patch) {
  pending.set(target, { ...(pending.get(target) || {}), ...patch });
  if (timer) return;
  timer = setTimeout(() => { timer = 0; const all = [...pending]; pending.clear(); all.forEach(([t, p]) => post({ target: t, ...p })); }, 80);
}
async function act(body) { await post(body); await poll(true); }

/* ---------- colour picker ---------- */
const PRESETS = ["#ff0000", "#ff7a00", "#ffd400", "#33ff00", "#00ffd0", "#0066ff", "#8000ff", "#ff00aa", "#ffffff"];
const pk = { h: 0, s: 1, v: 1, cb: null, anchor: null };
const hsv2hex = (h, s, v) => {
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return "#" + [f(5), f(3), f(1)].map((x) => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
};
const hex2hsv = (hex) => {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: h * 60, s: mx ? d / mx : 0, v: mx };
};
function pkPaint(emit = true) {
  const hex = hsv2hex(pk.h, pk.s, pk.v);
  $("sv").style.setProperty("--h", Math.round(pk.h));
  $("sv").firstElementChild.style.left = pk.s * 100 + "%";
  $("sv").firstElementChild.style.top = (1 - pk.v) * 100 + "%";
  $("hue").value = pk.h;
  $("prev").style.background = hex;
  if (document.activeElement !== $("hex")) $("hex").value = hex;
  if (emit && pk.cb) pk.cb(hex);
  if (pk.anchor) pk.anchor.style.background = hex;
}
function pkSet(hex) { Object.assign(pk, hex2hsv(hex)); pkPaint(false); }
function pkOpen(anchor, hex, cb) {
  pk.cb = null; pk.anchor = anchor; pkSet(hex); pk.cb = cb;
  const p = $("picker"); p.style.display = "block";
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left, innerWidth - 260)) + "px";
  p.style.top = (r.bottom + 8 + 330 > innerHeight ? Math.max(8, r.top - 8 - 300) : r.bottom + 8) + "px";
}
function pkClose() { $("picker").style.display = "none"; pk.cb = null; pk.anchor = null; }
{
  const sv = $("sv");
  const move = (e) => {
    const r = sv.getBoundingClientRect();
    pk.s = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    pk.v = 1 - Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    pkPaint();
  };
  sv.addEventListener("pointerdown", (e) => { sv.setPointerCapture(e.pointerId); move(e); sv.onpointermove = move; });
  sv.addEventListener("pointerup", () => { sv.onpointermove = null; });
  $("hue").oninput = (e) => { pk.h = +e.target.value; pkPaint(); };
  $("hex").oninput = (e) => { let v = e.target.value.trim(); if (!v.startsWith("#")) v = "#" + v; if (/^#[0-9a-f]{6}$/i.test(v)) { Object.assign(pk, hex2hsv(v)); pkPaint(); } };
  $("presets").replaceChildren(...PRESETS.map((c) => {
    const b = el("button", { type: "button", title: c, ariaLabel: c }); b.style.background = c;
    b.onclick = () => { Object.assign(pk, hex2hsv(c)); pkPaint(); }; return b;
  }));
  document.addEventListener("pointerdown", (e) => { if ($("picker").style.display === "block" && !$("picker").contains(e.target) && e.target !== pk.anchor) pkClose(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") pkClose(); });
}

/* ---------- control panel for one target ---------- */
function swatch(label, get, set) {
  const b = el("button", { type: "button", className: "sw", ariaLabel: label, title: label });
  b.onclick = () => pkOpen(b, get(), set);
  return b;
}
const row = (label, ...kids) => el("div", { className: "row" }, el("span", { className: "lbl" }, label), ...kids);

function slider(min, max, step, fmt, onInput) {
  const out = el("output"), inp = el("input", { type: "range", min, max, step });
  inp.oninput = () => { out.textContent = fmt(+inp.value); onInput(+inp.value); };
  return { inp, out, set(v) { if (document.activeElement !== inp) { inp.value = v; } out.textContent = fmt(+inp.value); } };
}

function makePanel(target) {
  let cur = null, effSig = "";
  const state = () => cur;
  const on = el("input", { type: "checkbox", ariaLabel: "Lights on" });
  on.onchange = () => send(target, { on: on.checked });
  const sel = el("select", { ariaLabel: "Effect" });
  sel.onchange = () => act({ target, effect: sel.value, on: true });
  const c1 = swatch("Colour", () => cur.color, (h) => send(target, { color: h }));
  const c2 = swatch("Second colour", () => cur.color2, (h) => send(target, { color2: h }));
  const speed = slider(0.1, 5, 0.1, (v) => v.toFixed(1) + "×", (v) => send(target, { speed: v }));
  const bright = slider(0, 1, 0.01, (v) => Math.round(v * 100) + "%", (v) => send(target, { brightness: v }));
  const r1 = row("Colour", c1), r2 = row("Second colour", c2);
  const rs = row("Speed", speed.inp, speed.out), rb = row("Brightness", bright.inp, bright.out);
  const extra = el("div");
  const strip = el("div", { className: "strip", title: "What this is showing right now" });
  const el_ = el("div", { className: "panel" }, strip,
    row("Lights", el("label", { className: "tog" }, on, el("span"))),
    row("Effect", sel), r1, r2, extra, rs, rb);

  function controls(eff, p) {
    const sig = eff.id + JSON.stringify(eff.controls.map((c) => c.property));
    if (extra.dataset.sig !== sig) {
      extra.dataset.sig = sig;
      extra.replaceChildren(...eff.controls.map((c) => {
        const send_ = (v) => send(target, { opts: { [c.property]: v } });
        const val = () => cur.opts[c.property] ?? c.default;
        let w;
        if (c.type === "color") { w = swatch(c.label, () => val(), (h) => send_(h)); w._get = () => val(); }
        else if (c.type === "boolean") { w = el("input", { type: "checkbox", ariaLabel: c.label }); w.onchange = () => send_(w.checked); }
        else if (c.type === "combobox") { w = el("select", { ariaLabel: c.label }, ...c.values.map((v) => el("option", { value: v, textContent: v }))); w.onchange = () => send_(w.value); }
        else if (c.type === "number") {
          const s = slider(c.min, c.max, c.step || (c.max - c.min > 20 ? 1 : 0.01), (v) => String(Math.round(v * 100) / 100), send_);
          w = el("span", { style: "display:contents" }, s.inp, s.out); w._s = s;
        } else { w = el("input", { type: "text", ariaLabel: c.label }); w.oninput = () => send_(w.value); }
        const r = row(c.label, w); r._w = w; r._c = c; return r;
      }));
    }
    for (const r of extra.children) {
      const c = r._c, w = r._w, v = p.opts[c.property] ?? c.default;
      if (c.type === "color") w.style.background = v;
      else if (c.type === "boolean") w.checked = !!+v || v === true;
      else if (c.type === "number") w._s.set(v);
      else if (document.activeElement !== w) w.value = v;
    }
  }

  return {
    el: el_, strip,
    update(p, effects) {
      cur = p;
      const es = effects.map((e) => e.id).join();
      if (effSig !== es) {
        effSig = es;
        const groups = [...new Set(effects.map((e) => e.group))];
        sel.replaceChildren(...groups.map((g) => el("optgroup", { label: g }, ...effects.filter((e) => e.group === g).map((e) => el("option", { value: e.id, textContent: e.name })))));
      }
      const eff = effects.find((e) => e.id === p.effect) || effects[0];
      if (document.activeElement !== sel) sel.value = p.effect;
      on.checked = p.on;
      r1.style.display = eff.color ? "" : "none"; r2.style.display = eff.color2 ? "" : "none";
      rs.style.display = eff.speed ? "" : "none";
      c1.style.background = p.color; c2.style.background = p.color2;
      speed.set(p.speed); bright.set(p.brightness);
      controls(eff, p);
    },
  };
}

/* ---------- page ---------- */
function build(s) {
  panels = new Map();
  const mk = (target) => { const h = makePanel(target); panels.set(target, h); return h; };

  const g = el("div", { className: "card" }, el("div", { className: "head" }, el("span", { className: "grow" }, el("span", { className: "name" }, "Everything"), el("div", { className: "sub" }, "The default for any device that has no settings of its own"))), mk("").el);
  g.querySelector(".panel").style.marginTop = "12px";
  $("global").replaceChildren(g);

  const devs = s.devices.map((d) => {
    const hasOwn = d.key in s.overrides;
    const head = el("div", { className: "head" },
      el("span", { className: "dot " + d.state }),
      el("span", { className: "grow" }, el("span", { className: "name" }, d.name),
        el("div", { className: "sub" }, d.state === "running" ? d.detail : d.state + (d.detail ? ": " + d.detail : ""))));
    const card = el("div", { className: "card" }, head);
    if (d.state !== "running") return card;

    const own = el("button", { type: "button", className: "btn", textContent: "Custom settings", ariaPressed: String(hasOwn) });
    own.onclick = () => act(hasOwn ? { target: d.key, reset: true } : { target: d.key });
    head.append(own);
    if (hasOwn) card.append(mk(d.key).el); else card.append(el("div", { className: "follow" }, "Following everything"));

    if (d.zones.length) {
      const list = el("div", { className: "zones" });
      const shown = open.has(d.key);
      const toggle = el("button", { type: "button", className: "btn", textContent: shown ? "Hide zones" : `Zones (${d.zones.length})` });
      toggle.onclick = () => { shown ? open.delete(d.key) : open.add(d.key); sig = ""; render(S); };
      head.append(toggle);
      if (shown) {
        for (const z of d.zones) {
          const key = d.key + "/" + z, zown = key in s.overrides;
          const zb = el("button", { type: "button", className: "btn", textContent: "Custom", ariaPressed: String(zown) });
          zb.onclick = () => act(zown ? { target: key, reset: true } : { target: key });
          const zrow = el("div", { className: "zone" }, el("div", { className: "head" }, el("span", { className: "grow" }, z), zb));
          if (zown) zrow.append(mk(key).el);
          list.append(zrow);
        }
        card.append(list);
      }
    }
    return card;
  });
  $("devices").replaceChildren(...(devs.length ? devs : [el("div", { className: "empty" }, "No devices found yet.")]));
}

function render(s) {
  const next = JSON.stringify([s.devices.map((d) => [d.key, d.state, d.zones]), Object.keys(s.overrides), [...open]]);
  if (next !== sig) { sig = next; build(s); }
  for (const [target, h] of panels) h.update(target ? s.overrides[target] : s.global, s.effects);
}

async function poll(force) {
  if (!force && (pending.size || (Date.now() - lastEdit < 1200 && S))) return; // do not fight an edit in progress
  try {
    S = await (await fetch("/api/state")).json();
    $("offline").style.display = "none";
    render(S);
  } catch { $("offline").style.display = "inline"; }
}
// Live colour strips: a separate, faster poll so animation is visible without re-reading the whole state.
async function previews() {
  if (!panels.size) return;
  try {
    const q = [...panels.keys()].map((t) => "t=" + encodeURIComponent(t)).join("&");
    const r = await (await fetch("/api/preview?" + q)).json();
    for (const [t, h] of panels) if (r[t]) h.strip.style.background = "linear-gradient(to right," + r[t].join(",") + ")";
  } catch {}
}
poll(); setInterval(poll, 1500); setInterval(previews, 250);
</script>
</body>
</html>
