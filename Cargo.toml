[package]
name = "refract"
version = "0.1.0"
edition = "2024"
description = "Lighting control for Linux that runs SignalRGB device plugins and effects"
license = "MIT"
repository = "https://github.com/delano-git/refract-rgb"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ksni = { version = "0.3.7", features = ["blocking"] }
libc = "0.2.191"
rquickjs = { version = "0.14.0", features = ["loader", "macro", "classes", "properties"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
